<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pizza Review RAG</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --panel: #242424;
      --text: #eee;
      --muted: #999;
      --border: #383838;
      --accent: #e57373;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .msg { max-width: 700px; }
  .msg.user { align-self: flex-end; }
  .bubble {
    padding: 0.6rem 0.9rem;
    border-radius: 0.8rem;
    background: var(--panel);
    border: 1px solid var(--border);
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border: none; }
  .sources {
    margin-top: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .source-chip {
    font-size: 0.75rem;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: default;
  }
  form {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
  }
  input[type=text] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 0.6rem 1.2rem;
    border-radius: 0.5rem;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Pizza Review RAG</h1>
  <p>Answers are grounded in the reviews retrieved from the vector store, shown as sources below each reply.</p>
</header>
<div id="messages"></div>
<form id="form">
  <input id="input" type="text" placeholder="Ask a question about the reviews..." autocomplete="off" />
  <button id="send" type="submit">Send</button>
</form>
<script>
const messages = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMessage(role) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  wrap.appendChild(bubble);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return { wrap, bubble };
}

function renderSources(wrap, sources) {
  if (!sources.length) return;
  const box = document.createElement("div");
  box.className = "sources";
  for (const s of sources) {
    const chip = document.createElement("span");
    chip.className = "source-chip";
    const rating = s.metadata.Rating !== undefined ? `${s.metadata.Rating}★ ` : "";
    const title = s.metadata.Title || "review";
    chip.title = s.content;
    chip.textContent = `${rating}${title}`;
    box.appendChild(chip);
  }
  wrap.appendChild(box);
}

async function ask(question) {
  addMessage("user").bubble.textContent = question;
  const { wrap, bubble } = addMessage("assistant");
  bubble.textContent = "";

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }),
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let boundary;
    while ((boundary = buffer.indexOf("\n\n")) !== -1) {
      const rawEvent = buffer.slice(0, boundary);
      buffer = buffer.slice(boundary + 2);
      if (!rawEvent.startsWith("data: ")) continue;

      const event = JSON.parse(rawEvent.slice(6));
      if (event.type === "sources") {
        renderSources(wrap, event.sources);
      } else if (event.type === "token") {
        bubble.textContent += event.text;
      } else if (event.type === "error") {
        bubble.textContent = "Error: " + event.message;
      }
      messages.scrollTop = messages.scrollHeight;
    }
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  sendBtn.disabled = true;
  try {
    await ask(question);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
